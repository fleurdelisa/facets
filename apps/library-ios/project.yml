name: Commonplace
options:
  bundleIdPrefix: com.facets
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Commonplace:
    type: application
    platform: iOS
    sources: [Commonplace]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facets.commonplace
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Commonplace/Info.plist
      properties:
        CFBundleDisplayName: Commonplace
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          # Lets you point the app at the web server on your Mac/LAN over http while developing.
          NSAllowsLocalNetworking: true
